name: Test

on:
  push:
    branches:
      - build
      - main

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.22.2]
        platform: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{matrix.platform}}

    steps:
      - name: Install go
        uses: actions/setup-go@v5
        with:
          go-version: ${{matrix.go-version}}

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Test
        run: go Test ./..
