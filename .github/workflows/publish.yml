name: Build and Deploy Docker Image
on:
  push:
    branches:
      - build
      - main
  pull_request:
    branches:
      - build
      - main

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build . --tag amaan287/go-api:$(date +%s) --tag amaan287/go-api:latest

      - name: Publish to Registry
        uses: elgohr/Publish-Docker-Github-Action@v5
        with:
          name: amaan287/go-api
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          tags: "latest,$(date +%s)"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image
            docker pull amaan287/go-api:latest

            # Stop and remove existing container if it exists
            docker stop go-api-container || true
            docker rm go-api-container || true

            # Run the new container
            docker run -d \
              --name go-api-container \
              -p 3000:3000 \
              --restart unless-stopped \
              amaan287/go-api:latest

            # Clean up old images
            docker image prune -f
